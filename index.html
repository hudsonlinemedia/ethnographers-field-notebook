<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prof Honey's Field Notebook | The Ethnographer's Field Notebook</title>
<meta name="description" content="An ethnography field game guided by Prof Honey: twelve field sites, evidence decisions and a field notebook.">
<style>
:root{--paper:#f1ebdd;--page:#fbf8f0;--ink:#161616;--graphite:#5b5a56;--soft:#8a8984;--rule:#c9d6dc;--margin:#d9a3a3;--green:#2c7a3a;--red:#c0202b;
 --hand:'Bradley Hand','Segoe Print','Chalkboard SE','Comic Neue','Marker Felt',cursive;--serif:Georgia,'Iowan Old Style','Palatino Linotype',serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#d8d2c3;color:var(--ink);font:17px/1.55 var(--serif);min-height:100vh;
 background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:5px 5px}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
.book{max-width:1120px;margin:0 auto;padding:14px 14px 40px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 4px 12px}
.brand{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;line-height:1.05}
.brand b{font:700 1.25rem var(--hand)}
.brand span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite)}
.topbar nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.6px solid var(--ink);background:var(--page);border-radius:6px 6px 2px 2px;padding:6px 12px;font:600 .9rem var(--hand);box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.tab:hover,.tab:focus-visible{background:#fff}
.status{display:flex;align-items:center;gap:10px;margin:0 4px 10px;font-size:.88rem;color:var(--graphite)}
.pbar{flex:1;height:10px;border:1.4px solid var(--ink);border-radius:6px;background:var(--page);overflow:hidden}
.pbar span{display:block;height:100%;width:0;background:repeating-linear-gradient(135deg,#6d6c67 0 3px,#a5a39c 3px 6px);transition:width .5s}
/* notebook page */
.sheet{position:relative;background:var(--page);border:1.6px solid var(--ink);border-radius:4px 10px 10px 4px;box-shadow:4px 5px 0 rgba(0,0,0,.18),0 18px 30px rgba(0,0,0,.12);
 background-image:linear-gradient(90deg,transparent 54px,var(--margin) 54px,var(--margin) 55.5px,transparent 55.5px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);
 padding:26px 26px 30px 76px;min-height:60vh}
.sheet::before{content:'';position:absolute;left:18px;top:24px;bottom:24px;width:16px;background:radial-gradient(circle at 8px 8px,#d8d2c3 5.5px,var(--ink) 6px,transparent 7px) 0 0/16px 44px repeat-y}
h1,h2,h3{font-family:var(--hand);line-height:1.15;margin:.2em 0 .4em}
h2{font-size:1.65rem}
h3{font-size:1.22rem}
.kicker{font:700 .74rem/1.2 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
p{margin:.5em 0}
.muted{color:var(--graphite)}
/* layout with Prof Honey */
.site{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.guide{position:sticky;top:10px}
.guide .ph{height:300px;width:100%}
.bubble{position:relative;background:#fff;border:1.6px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:.95rem;box-shadow:2px 3px 0 rgba(0,0,0,.18);margin-top:6px}
.bubble::before{content:'';position:absolute;top:-11px;left:46%;border:10px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bubble::after{content:'';position:absolute;top:-8px;left:calc(46% + 2px);border:8px solid transparent;border-bottom-color:#fff;border-top:0}
.bubble .who{display:block;font:700 .95rem var(--hand);margin-bottom:2px}
.bubble.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
/* cards */
.scene{position:relative;background:#fffdf7;border:1.4px solid var(--ink);padding:14px 16px 12px;margin:10px 4px 18px;transform:rotate(-.6deg);box-shadow:2px 3px 0 rgba(0,0,0,.15)}
.scene::before,.scene::after{content:'';position:absolute;width:70px;height:20px;background:rgba(214,209,190,.85);top:-10px;left:-14px;transform:rotate(-10deg);border:1px solid rgba(0,0,0,.08)}
.scene::after{left:auto;right:-14px;transform:rotate(9deg)}
.scene .kicker{margin-bottom:4px}
.decision{margin:16px 0;padding:12px 0 6px;border-top:1.4px dashed var(--soft);position:relative}
.decision h3{margin-top:0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1.6px solid var(--ink);border-radius:8px;padding:10px 12px;box-shadow:2px 2px 0 rgba(0,0,0,.2);transition:transform .08s}
.opt:hover:not(:disabled),.opt:focus-visible{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.opt:disabled{cursor:default}
.opt .box{flex:none;width:20px;height:20px;border:1.6px solid var(--ink);border-radius:3px;margin-top:3px;display:grid;place-items:center;font:700 15px/1 system-ui;background:#fff}
.opt.right{border-color:var(--green)}
.opt.right .box{border-color:var(--green);color:var(--green)}
.opt.picked:not(.right){background:#f2f0ea}
.opt:disabled:not(.picked):not(.right){opacity:.6}
.notes{margin-top:10px;background:#fff8d9;border:1.4px solid #b9a970;border-radius:3px;padding:10px 12px;box-shadow:2px 3px 0 rgba(0,0,0,.12);transform:rotate(.35deg)}
.notes b{font-family:var(--hand)}
.notes .best{display:block;margin-top:4px;color:var(--graphite);font-size:.92rem}
.stamp{position:absolute;right:4px;top:4px;font:700 .95rem/1 'Courier New',monospace;letter-spacing:.08em;color:var(--green);border:2.4px solid var(--green);padding:5px 8px;border-radius:3px;transform:rotate(-8deg);opacity:.9;pointer-events:none}
.stamp.go{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{0%{transform:rotate(-8deg) scale(2.2);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:.9}}
.doodle{position:absolute;right:8px;top:2px;width:90px;height:44px;pointer-events:none}
.doodle path{fill:none;stroke:var(--green);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
label{display:block;margin:10px 0}
label > span{display:block;font:700 1rem var(--hand)}
textarea,input[type=text],select{width:100%;background:rgba(255,255,255,.75);border:1.4px solid var(--soft);border-radius:4px;padding:8px 10px;line-height:32px;font-family:var(--hand);font-size:1.05rem}
textarea{min-height:128px;resize:vertical;background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local;padding-top:2px;line-height:32px}
select{width:auto;line-height:1.3}
.btn{display:inline-block;border:1.8px solid var(--ink);border-radius:8px;padding:10px 16px;background:#fff;font:700 1rem var(--hand);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.btn.primary{background:var(--ink);color:#fbf8f0}
.btn:hover,.btn:focus-visible{transform:translate(-1px,-1px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
/* home */
.cover{display:grid;grid-template-columns:1.15fr .85fr;gap:10px;align-items:end}
.cover h1{font-size:clamp(2.1rem,5vw,3.4rem);margin:.1em 0}
.cover .sub{font:italic 1.1rem var(--serif);color:var(--graphite)}
.cover .credit{font:700 .72rem system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;margin-top:14px}
.cover .ph{height:min(430px,60vw);width:100%}
.mission{border:1.4px solid var(--ink);background:#fff;padding:12px 16px;border-radius:4px;margin:16px 0;box-shadow:2px 3px 0 rgba(0,0,0,.12)}
.part{margin:26px 0 8px}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.sitecard{position:relative;text-align:left;background:#fff;border:1.6px solid var(--ink);border-radius:6px;padding:12px 12px 10px;box-shadow:3px 3px 0 rgba(0,0,0,.2);min-height:104px;display:flex;flex-direction:column;gap:4px}
.sitecard:nth-child(odd){transform:rotate(-.5deg)}.sitecard:nth-child(even){transform:rotate(.5deg)}
.sitecard:hover,.sitecard:focus-visible{transform:translate(-1px,-2px);box-shadow:4px 5px 0 rgba(0,0,0,.22)}
.sitecard .num{font:700 .74rem system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite)}
.sitecard strong{font:700 1.12rem/1.2 var(--hand)}
.sitecard .dots{margin-top:auto;display:flex;gap:4px;flex-wrap:wrap}
.sitecard .dots i{width:10px;height:10px;border:1.3px solid var(--ink);border-radius:50%;display:block}
.sitecard .dots i.on{background:var(--ink)}
.sitecard .dots i.ok{background:var(--green);border-color:var(--green)}
.sitecard .done{position:absolute;right:8px;top:8px;font:700 .7rem 'Courier New',monospace;color:var(--green);border:1.8px solid var(--green);padding:2px 5px;transform:rotate(6deg)}

/* title screen */
.titlescreen{position:relative;overflow:hidden;border:1.6px solid var(--ink);border-radius:6px;background:#fbf8f0;height:clamp(500px,calc(100vh - 140px),760px);margin:0 0 8px;box-shadow:3px 4px 0 rgba(0,0,0,.15)}
.tburst{position:absolute;width:150vmax;height:150vmax;right:calc(20% - 75vmax);top:calc(48% - 75vmax);background:repeating-conic-gradient(from 0deg,rgba(22,22,22,.045) 0 2deg,transparent 2deg 8deg);animation:spin 160s linear infinite;z-index:0}
.tburst::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fbf8f0 0,rgba(251,248,240,.6) 7%,rgba(251,248,240,0) 22%)}
@keyframes spin{to{transform:rotate(360deg)}}
.titlescreen .pano{position:absolute;left:0;bottom:0;width:100%;height:auto;aspect-ratio:1760/290;z-index:1;overflow:visible}
.tcontent{position:relative;z-index:3;max-width:58%;padding:clamp(18px,4vh,40px) clamp(18px,3vw,40px)}
.tcontent h1{font-size:clamp(2.2rem,5.2vw,3.9rem);margin:.08em 0 .1em;text-shadow:0 0 12px #fbf8f0,0 0 4px #fbf8f0}
.tcontent .sub{font:italic 1.12rem var(--serif);color:var(--graphite)}
.tcontent .credit{font:700 .72rem system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;margin:12px 0 8px}
.titlescreen .thoney.ph{position:absolute;right:-2%;bottom:1%;height:68%;aspect-ratio:3/4;z-index:4}
.pin-label{font:700 26px var(--hand);fill:var(--ink);paint-order:stroke;stroke:#fbf8f0;stroke-width:4px;stroke-linejoin:round}
.route-reveal{stroke-dasharray:1;stroke-dashoffset:1;animation:reveal 4.2s .3s ease-in-out forwards}
@keyframes reveal{to{stroke-dashoffset:0}}
.pin{opacity:0;animation:pinDrop .55s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pinDrop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.clouds{animation:drift 70s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-36px)}to{transform:translateX(36px)}}
.birds{animation:drift 26s ease-in-out infinite alternate}
.bird{transform-box:fill-box;animation:flap .55s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.45) translateY(2px)}}
.train{animation:train 16s ease-in-out infinite alternate}
@keyframes train{from{transform:translateX(-14px)}to{transform:translateX(26px)}}
.canoe{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(3px) rotate(1.5deg)}}
.palms{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.4deg)}}
.spout{transform-box:fill-box;transform-origin:50% 100%;animation:spout 4.5s ease-out infinite}
@keyframes spout{0%,55%{transform:scaleY(.1);opacity:0}65%{opacity:1}80%{transform:scaleY(1.1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.fluke{transform-box:fill-box;transform-origin:10% 100%;animation:fluke 6s ease-in-out infinite alternate}
@keyframes fluke{from{transform:rotate(-3deg)}to{transform:rotate(4deg) translateY(2px)}}
.sun{transform-box:fill-box;transform-origin:50% 50%;animation:spin 90s linear infinite}
.mist{animation:drift 22s ease-in-out infinite alternate}
.smoke{transform-box:fill-box;transform-origin:50% 100%;animation:smoke 3.2s ease-in-out infinite alternate}
@keyframes smoke{from{transform:translateX(-2px) scaleY(.92);opacity:.6}to{transform:translateX(3px) scaleY(1.06);opacity:1}}

/* lens zones: rays spin, fade, and a location comes into focus */
.zone{position:absolute;z-index:1;pointer-events:none;aspect-ratio:1}
.zlens{position:absolute;inset:0;border-radius:50%;overflow:hidden;-webkit-mask:radial-gradient(circle,#000 58%,transparent 70.5%);mask:radial-gradient(circle,#000 58%,transparent 70.5%)}
.zrays{position:absolute;inset:-25%;background:repeating-conic-gradient(from 0deg,rgba(22,22,22,.16) 0 2.2deg,transparent 2.2deg 9deg);animation:spin 50s linear infinite;transition:opacity 1.6s ease}
.zone:nth-of-type(2n) .zrays{animation-direction:reverse;animation-duration:64s}
.zscene{position:absolute;inset:0;width:100%;height:100%;opacity:0;filter:blur(10px) grayscale(1);transform:scale(1.18) rotate(-8deg);transition:opacity 2.2s ease,filter 2.4s ease,transform 4s cubic-bezier(.2,.7,.2,1)}
.zone.on .zscene{opacity:.72;filter:blur(0) grayscale(1);transform:scale(1) rotate(0)}
.zone.on .zrays{opacity:.18}
.zring{position:absolute;inset:6%;width:88%;height:88%;overflow:visible}
.zring circle{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:1;stroke-dashoffset:1;opacity:.55;transition:stroke-dashoffset 5.5s cubic-bezier(.4,0,.2,1) .3s}
.zone.on .zring circle{stroke-dashoffset:0}
.zlabel{position:absolute;left:50%;bottom:-2%;transform:translate(-50%,6px) rotate(-3deg);white-space:nowrap;text-align:center;opacity:0;transition:opacity 1.2s ease .5s,transform 1.4s ease .5s;font:700 1.05rem/1.1 var(--hand);text-shadow:0 0 6px #fbf8f0,0 0 3px #fbf8f0}
.zlabel small{display:block;font:italic .8rem var(--serif);color:var(--graphite)}
.zone.on .zlabel{opacity:1;transform:translate(-50%,0) rotate(-3deg)}
.z1{left:-2%;top:9%;width:clamp(260px,38%,400px)}
.z2{left:30%;top:46%;width:clamp(220px,30%,320px)}
.z3{left:auto;right:23%;top:3%;width:clamp(200px,25%,270px)}
.tcontent{z-index:3}
.z1 .zlabel{left:auto;right:-8%;top:6%;bottom:auto;transform:translate(0,6px) rotate(-4deg);text-align:left}
.zone.z1.on .zlabel{transform:translate(0,0) rotate(-4deg)}

.qhead{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:center}
.qimg{position:relative;margin:4px 4px 8px;background:#fffdf7;border:1.4px solid var(--ink);padding:6px;transform:rotate(1.2deg);box-shadow:2px 3px 0 rgba(0,0,0,.14)}
.decision:nth-of-type(odd) .qimg{transform:rotate(-1deg)}
.qimg::before{content:'';position:absolute;width:54px;height:16px;background:rgba(214,209,190,.85);top:-8px;left:50%;margin-left:-27px;transform:rotate(-4deg);border:1px solid rgba(0,0,0,.08)}
.qimg svg{display:block;width:100%;height:auto}
/* chapter card */
.chapter{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:center;min-height:52vh}
.chapter .ph{height:340px;width:100%}
.chapter .roman{font:700 4.2rem/1 var(--hand)}
/* report */
.entry{border-top:1.4px dashed var(--soft);padding:10px 0}
.entry p{white-space:pre-wrap}
.pill{display:inline-block;font:700 .75rem system-ui;letter-spacing:.06em;border:1.3px solid var(--ink);border-radius:999px;padding:1px 8px;margin-left:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* gag */
.snap{position:absolute;right:16px;top:-6px;font:700 1.3rem var(--hand);transform:rotate(10deg);animation:snap .9s ease}
@keyframes snap{0%{opacity:0;transform:rotate(10deg) scale(.5)}30%{opacity:1;transform:rotate(-6deg) scale(1.2)}100%{transform:rotate(10deg) scale(1)}}
.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px) rotate(-1deg)}40%{transform:translateX(5px) rotate(1deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.bubble.r::before{top:22px;left:auto;right:-11px;border:10px solid transparent;border-left-color:var(--ink);border-right:0}
.bubble.r::after{top:24px;left:auto;right:-8px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.bubble.l::before{top:22px;left:-11px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble.l::after{top:24px;left:-8px;border:8px solid transparent;border-right-color:#fff;border-left:0}
@media (max-width:760px){
 .bubble.r::before,.bubble.l::before{top:-11px;left:46%;right:auto;border:10px solid transparent;border-bottom-color:var(--ink);border-top:0}
 .bubble.r::after,.bubble.l::after{top:-8px;left:calc(46% + 2px);right:auto;border:8px solid transparent;border-bottom-color:#fff;border-top:0}
 body{font-size:16px}
 .sheet{padding:18px 14px 24px 44px}
 .sheet{background-image:linear-gradient(90deg,transparent 32px,var(--margin) 32px,var(--margin) 33.5px,transparent 33.5px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px)}
 .sheet::before{left:8px}
 .site{grid-template-columns:1fr}
 .guide{position:relative;top:0;display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center}
 .guide .ph{height:140px}
 .bubble{margin-top:0}
 .bubble::before{top:18px;left:-11px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
 .bubble::after{top:20px;left:-8px;border:8px solid transparent;border-right-color:#fff;border-left:0}
 .titlescreen{height:auto;min-height:700px}
 .qhead{grid-template-columns:1fr}
 .qimg{max-width:280px;margin:6px auto 4px;order:-1}
 .z1{left:-14%;top:0;width:78%}
 .z1 .zlabel{left:50%;right:auto;top:auto;bottom:-2%;transform:translate(-50%,6px) rotate(-3deg)}
 .zone.z1.on .zlabel{transform:translate(-50%,0) rotate(-3deg)}
 .z2{left:auto;right:-10%;top:30%;width:62%}
 .z3{left:-12%;top:58%;width:58%}
 .tcontent{max-width:100%;padding:16px}
 .tcontent h1{font-size:2.1rem}
 .titlescreen .pano{width:340%;max-width:none;animation:pan 50s ease-in-out infinite alternate}
 @keyframes pan{to{transform:translateX(-62%)}}
 .pin-label{font-size:20px}
 .titlescreen .thoney.ph{height:44%;right:-2%;bottom:1%}
 .tburst{right:calc(14% - 75vmax);top:calc(72% - 75vmax)}
 .cover{grid-template-columns:1fr}
 .cover .ph{height:300px;order:-1}
 .chapter{grid-template-columns:1fr;text-align:center}
 .chapter .ph{height:250px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pin{opacity:1}.route-reveal{stroke-dashoffset:0}}
@media print{.topbar,.status,button,.guide{display:none!important}body{background:#fff}.sheet{box-shadow:none;border:0;background:#fff;padding:0}.sheet::before{display:none}}
.ph{position:relative}
.ph-svg{width:100%;height:100%;display:block;overflow:visible}
.ph .ph-lines{opacity:0}
.ph .ph-pencil{display:none}
.ph.ph-drawing .ph-lines{opacity:1}
.ph.ph-drawing .ph-lines path,.ph.ph-drawing .ph-lines circle{stroke:#1a120a}
.ph.ph-drawing .ph-pencil{display:block}
.ph .ph-steam .ph-puff{opacity:0}
/* easter-egg hat gag */
.ph.gag .ph-hat{transform-box:fill-box;transform-origin:50% 60%;animation:hatFlip 2.2s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes hatFlip{
 0%{transform:none}
 12%{transform:translate(6px,-48px) rotate(-25deg)}
 35%{transform:translate(28px,-150px) rotate(190deg)}
 55%{transform:translate(18px,-175px) rotate(450deg)}
 72%{transform:translate(6px,-80px) rotate(720deg)}
 90%{transform:translate(0,3px) rotate(720deg)}
 100%{transform:translate(0,0) rotate(720deg)}}
.ph.gag .ph-hatshade{animation:shadeOff 2.2s linear forwards}@keyframes shadeOff{0%,100%{opacity:1}8%,90%{opacity:0}}.ph.gag .ph-arm{transform-box:view-box;animation:armL .38s ease-in-out 6 alternate}
.ph.gag .ph-arm-l{transform-origin:95px 264px}.ph.gag .ph-arm-r{transform-origin:205px 264px;animation-name:armR;animation-delay:.09s}
.ph.gag .ph-fore{transform-box:view-box;animation:foreL .38s ease-in-out 6 alternate}
.ph.gag .ph-fore-l{transform-origin:54px 194px}.ph.gag .ph-fore-r{transform-origin:246px 194px;animation-name:foreR;animation-delay:.09s}
.ph.gag .ph-hand{transform-box:fill-box;transform-origin:50% 100%;animation:handL .38s ease-in-out 6 alternate}
.ph.gag .ph-hand-r{animation-name:handR;animation-delay:.09s}
@keyframes armL{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
@keyframes armR{from{transform:rotate(2deg)}to{transform:rotate(-2.5deg)}}
@keyframes foreL{from{transform:rotate(-11deg)}to{transform:rotate(9deg)}}
@keyframes foreR{from{transform:rotate(11deg)}to{transform:rotate(-9deg)}}
@keyframes handL{from{transform:rotate(3deg)}to{transform:rotate(-3deg)}}
@keyframes handR{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.ph.gag .ph-puff{transform-box:fill-box;transform-origin:50% 100%;animation:steam 1.1s ease-out forwards}

can operate outside awareness"], 2, "Enculturation can produce embodied habits."]], "Describe a tacit rule you learned and a possible misunderstanding."], ["Mystery of the wink", "Fictional scene: At a card table, Jo closes one eye briefly while looking toward Pat. A third person laughs.", [["Which is a thin description?", ["Jo mocks Pat", "Jo signals a secret alliance", "Jo briefly closes one eye"], 2, "Thin description records the movement."], ["New clue: Pat says they had agreed on a signal before the game. What is now plausible?", ["A universal meaning of winking", "A shared signal", "Proof of romance"], 1, "Context supports a specific interpretation."], ["Another observer thought Jo was flirting. What should you do?", ["Record both perspectives and distinguish evidence", "Erase the disagreement", "Assume everyone agrees"], 0, "Meanings can be contested."], ["What makes a description thick?", ["Counting every movement only", "More adjectives", "Interpreting action in its social context"], 2, "Thick description connects action, meaning and context."]], "Write a thick description using the signal agreement and the conflicting interpretation."], ["Armchair archive", "Simulated nineteenth-century archive: a traveler reports no coins, a missionary reports rituals, and an official claims the community lacks government. None describes prolonged local participation.", [["What is the major methodological weakness?", ["Too much historical context", "Reliance on secondhand, limited accounts", "Too many insider interviews"], 1, "Armchair anthropology relied heavily on others’ reports."], ["No coins means no economy. What is wrong?", ["Only cities have exchange", "Nothing", "It ignores production, exchange and consumption outside markets"], 2, "Money is not necessary for an economy."], ["How would Boas redesign the study?", ["Collect only skull measurements", "Rank societies on one ladder", "Study particular histories, languages and local meanings"], 2, "Historical particularism rejects a universal cultural ladder."], ["How did evolutionary rankings support colonialism?", ["They demonstrated equal political power", "They rejected ethnocentrism", "They framed domination as helping supposedly inferior peoples"], 2, "Hierarchies supplied ideological justification."], ["Boas’s immigrant research challenged which assumption?", ["Environment can influence development", "Physical traits are wholly fixed and indicate intellectual worth", "Human variation exists"], 1, "His work challenged racial essentialism; it does not establish that every trait is environmentally determined."]], "Choose one archive claim and explain how firsthand evidence could change the theory."], ["Entering the field", "Fictional community center: you are invited to a weekly meal. A coordinator offers an introduction, one member declines an interview, and another invites you to help set tables.", [["Best first action?", ["Demand access", "Record everyone secretly", "Explain your purpose and ask permission"], 2, "Consent and transparency matter."], ["A member declines. What do you do?", ["Ask someone to secretly record them", "Respect the refusal", "Offer points for disclosure"], 1, "Rapport never overrides consent."], ["Which question invites an emic account?", ["Is my explanation correct?", "What does this gathering mean to you?", "Why is your custom so strange?"], 1, "Open questions allow participants to teach the researcher."], ["What does helping set tables offer?", ["An opportunity to learn through participation", "Proof that all members agree", "Guaranteed insider status"], 0, "Participation gives contextual insight, not automatic understanding."], ["Your host introduces you as a volunteer rather than researcher. What next?", ["Ignore it", "Assume it has no effect", "Clarify your role and consider how it affects access"], 2, "Assigned roles shape ethnographic knowledge."]], "Write an open-ended interview question and explain how your role might shape the answer."], ["Research toolkit", "You want to understand why some city residents avoid medical clinics. A survey reaches 1,000 residents; interviews and repeated observations focus on a small healing group.", [["Which method best estimates prevalence in a representative sample?", ["Survey", "One life history", "One observation"], 0, "Quantitative research can estimate distributions with appropriate sampling."], ["Which best explores how avoidance acquires meaning?", ["A ranking of cultures", "Repeated interviews and participant-observation", "Only a count"], 1, "Qualitative methods reveal contextual meanings."], ["Which is a manageable microculture?", ["A particular healing group", "All residents of Russia", "All humans"], 0, "A bounded fieldsite permits intensive engagement."], ["Interviews reveal an unexpected theme. What next?", ["Claim the theme applies to everyone", "Discard the interviews", "Revise the research question transparently"], 2, "Ethnographic research can evolve with evidence."], ["What can a small fieldsite establish?", ["Universal causation", "Detailed situated understanding", "National prevalence automatically"], 1, "Depth is not statistical representativeness."]], "Design a research question, fieldsite, two methods and one limitation."], ["Christmas in the Kalahari", "Based on Richard Borshay Lee’s reading. Lee buys a large ox to thank the Ju/’hoansi after a year of research. He has substantial food supplies and controls access to tobacco.", [["Ben!a and others criticize the ox. Before further evidence, what is warranted?", ["They cannot judge cattle", "They are certainly ungrateful", "Several explanations remain possible"], 2, "Keep hypotheses provisional."], ["Tomazo describes a preference for fat; another warns about unequal portions. What should you do?", ["Ignore everyone", "Assume malice", "Investigate the claims and social context"], 2, "Multiple accounts require contextual inquiry."], ["At the feast the ox proves fat and people laugh. What changes?", ["The literal thinness explanation loses support", "The laughter proves hatred", "The ox is still thin"], 0, "New observation undermines the literal interpretation."], ["Later /gaugo explains hunters also receive insults. Tomazo links this to arrogance. What is the strongest interpretation?", ["A custom only for outsiders", "A practice that discourages boasting and reinforces equality", "A lack of gratitude"], 1, "The practice has a social meaning beyond the literal words."], ["Why does Lee’s control over tobacco matter?", ["It is irrelevant", "It reveals unequal power and makes reflexivity necessary", "It proves his gift had no meaning"], 1, "His position shapes relationships and interpretations."]], "Cite two specific moments from Lee’s reading and explain how they changed your interpretation. What does his own power add?"], ["Indigenous science in Alaska", "Based on Richard Nelson’s reading. Inupiaq hunters accumulate environmental observations; Koyukon accounts emphasize respectful relationships with animals. These are distinct communities.", [["Igruk counts whale blows and times dives. What does this demonstrate?", ["A controlled laboratory experiment", "Absence of reasoning", "Systematic observation and prediction"], 2, "Naturalistic observation can support empirical knowledge."], ["Simulated whale data: surfacing at 0 m, 100 m, 200 m at 20-second intervals. If the pattern continues, next location?", ["900 m", "0 m", "300 m"], 2, "The simple simulated pattern predicts 300 m, not a real-world navigation rule."], ["A younger hunter reports observing evidence consistent with elders’ account. What is this?", ["Proof of every traditional claim", "No evidence", "Corroboration, not absolute proof"], 2, "Independent observations can strengthen a claim."], ["Igruk reports ringing in his ears before a whale appears. What is warranted?", ["The mechanism is proven", "Nelson reports an event and an explanation remains uncertain", "The event must be fabricated"], 1, "Distinguish reported observation from causal explanation."], ["How does this reading challenge Morgan?", ["Spiritual beliefs prevent empirical knowledge", "All societies are identical", "Complex knowledge is not dependent on industrial technology"], 2, "The account challenges a hierarchy of intellectual capacity."]], "Use two examples from Nelson to challenge unilineal evolutionism; distinguish empirical knowledge from worldview."], ["Trobriand Islands", "Based on the module’s account of Malinowski. Skilled fishers use rituals in uncertain situations; Kula valuables circulate through enduring exchange relationships.", [["Why compare predictable and uncertain fishing contexts?", ["To rank intelligence", "To prove magic causes fish to appear", "To investigate when ritual occurs and its possible function"], 2, "Functionalism asks what practices do in context."], ["Which explanation is functionalist?", ["Ritual proves intellectual inferiority", "Ritual has no social context", "Ritual may help manage anxiety under uncertainty"], 2, "Malinowski linked magic to uncertainty."], ["Kula necklaces and armbands circulate in opposite directions. What matters beyond the object?", ["Only retail price", "Relationships, histories and obligations", "Only decoration"], 1, "Exchange sustains social connections and prestige."], ["What might a functionalist account miss?", ["Nothing at all", "Historical change and unequal power", "Every possible social function"], 1, "One theoretical lens cannot answer every question."]], "Explain one function of ritual and one of Kula exchange; identify a question functionalism leaves open."], ["Nekalimin cultural systems", "Based on the module’s account of Wesch. In the described fieldsite, rainforest gardens, reciprocal food gifts and relationships are closely connected.", [["A gift of food is offered. Why might immediate cash payment offend?", ["It may close an ongoing reciprocal relationship", "Money is universally immoral", "The food has no value"], 0, "A gift can establish a continuing obligation."], ["Rocky nutrient-poor soil belongs to which analytical level?", ["Environment", "Social structure", "Superstructure"], 0, "Environmental conditions shape and are shaped by human activity."], ["Shifting cultivation belongs primarily to which level?", ["Social structure", "Infrastructure", "Superstructure"], 1, "Subsistence and production are infrastructure."], ["Reciprocal obligations and customary land arrangements?", ["Social structure", "Environment", "Superstructure only"], 0, "These organize relationships and access."], ["Cooperation as an ideal and spiritual explanations of illness?", ["Infrastructure", "Superstructure", "Environment"], 1, "Values and worldview are superstructure."], ["Hypothetical wage labor expands. Which prediction is best?", ["Only infrastructure can change", "All reciprocity disappears instantly", "Gift obligations might change, but outcomes require evidence"], 2, "Levels interact; change is not deterministic."]], "Trace two links between cultural levels, then compare reciprocity in Wesch and Lee without treating the societies as identical."], ["Post-Soviet Moscow", "Based on your instructor’s fieldwork account: 1985 restrictions; 1991–92 economic transformation; 1990s spiritual experimentation; 2000s Ascension fieldwork; later restrictions on expression.", [["Shortages and rising prices primarily illustrate which level?", ["Infrastructure", "Biology", "Superstructure only"], 0, "Economic conditions affect daily life."], ["Changing laws and media institutions illustrate?", ["Environment", "Genetics", "Social structure"], 2, "Political and institutional arrangements organize social life."], ["Religious experimentation illustrates?", ["Changing worldview and values", "A fixed national culture", "No cultural change"], 0, "Superstructure changes in relation to other levels."], ["Women describe avoiding clinics. What is a productive next step?", ["Explore home healing and narrow the fieldsite", "Assume all women avoid clinics", "Ignore unexpected themes"], 0, "Emergent themes can guide qualitative research."], ["Ascension uses unfamiliar terms. How should you learn them?", ["Assume dictionary meanings are sufficient", "Treat every member as identical", "Ask how members use them in context"], 2, "Local vocabulary is part of cultural knowledge."], ["The instructor initially wonders whether emotional reactions in the Birth Canal are performed. Participation produces unexpected emotion. What changes?", ["All participants feel the same", "Clinical efficacy is proven", "The possibility of genuine emotional experience gains support"], 2, "Participation deepens understanding without establishing medical efficacy."], ["What is the strongest broader conclusion?", ["Every Russian joined alternative healing", "The ritual caused political change", "Economic and institutional changes may contextualize this microculture, but it cannot represent all Russians"], 2, "Connect scales while respecting limits."]], "Use specific evidence from the instructor’s account to connect two cultural levels and explain what participation revealed and could not establish. Do not reenact the ritual."], ["Final fieldwork: community table", "Fictional urban mutual-aid group. A donor is teased for bringing a large meal; a newcomer offers payment; a younger member proposes an app. An older member says the app excludes people without phones. A coordinator says teasing prevents donors from dominating decisions.", [["Which observation is least interpretive?", ["The newcomer is selfish", "The donor wants power", "A newcomer offers payment"], 2, "Separate action from inferred motivation."], ["Which interview question is strongest?", ["What does offering food mean to different members?", "Why do older people hate technology?", "Why are you ungrateful?"], 0, "Seek multiple insider perspectives."], ["What does disagreement over the app demonstrate?", ["Technology has no social effects", "Culture is uniform", "Culture changes and is contested"], 2, "Different access and values shape responses."], ["What is a plausible connection between levels?", ["All members have equal resources", "Phone access affects participation and may reshape ideals of inclusion", "Values never affect technology"], 1, "Infrastructure, organization and values interact."], ["What remains uncertain?", ["Whether teasing has the same meaning for every participant", "Whether the app was proposed", "Whether a newcomer offered payment"], 0, "A good ethnographer recognizes limits."]], "Write a final thick description using at least three pieces of evidence, two insider perspectives, a revised interpretation, and one unanswered question."]];

  if(!last){honey(side,{pose:celeb%2?'point':'write',mouth:'grin'});bubble(bb,YES[yesI++%YES.length])}}
 else{wrongRun++;
  if(wrongRun>=3){wrongRun=0;honey(side,{pose:'oops',mouth:'o',brow:'up'});side.insertAdjacentHTML('beforeend','<span class="snap" aria-hidden="true">snap!</span>');el.classList.add('shake');
   if(!last)bubble(bb,'Three in a row? Even my pencil just snapped. Deep breath: reread the scene, then my notes.')}
  else if(!last){honey(side,{pose:'idle'});bubble(bb,NO[noI++%NO.length])}}
 if(last){honey(side,{pose:'write',mouth:'grin'});bubble(bb,i<11?'Site complete. Now the important part: write it up while it’s fresh.':'That’s the whole notebook. Write your final thick description, then download your report.')}
 const nx=document.getElementById(`d${i}-${j+1}`);setTimeout(()=>{(nx||el).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:nx?'start':'nearest'})},nx?650:0)}

function report(){
 v.innerHTML=`<div class="kicker">Field report</div><h2>My field notebook</h2><p>${esc(s.name)}${s.name?' · ':''}${score()} / ${total} evidence points. Written analysis is for reflection or instructor review.</p><div class="row"><button class="btn primary" onclick="download()">Save text report</button><button class="btn" onclick="window.print()">Print</button></div>`+
 C.map((c,i)=>`<section class="entry"><h3>${i+1}. ${esc(c[0])} ${done(i)?'<span class="pill">complete</span>':''}</h3><p><b>Initial hypothesis:</b> ${esc(s.hyp[i]||'Not entered')} (${esc(s.conf[i]||'confidence not recorded')})</p><p><b>Field notes:</b> ${esc(s.notes[i]||'Not entered')}</p><p><b>Revision:</b> ${esc(s.rev[i]||'Not entered')}</p><button class="btn" onclick="openCase(${i})">Return to site</button></section>`).join('')+
 `<section class="entry"><h3>Mini-ethnography</h3><p>${esc(s.mini)||'Not entered'}</p></section>`;toTop()}

function download(){let t='THE ETHNOGRAPHER’S FIELD NOTEBOOK\n'+s.name+'\nEvidence points: '+score()+'/'+total+'\n';
 C.forEach((c,i)=>{t+='\n'+(i+1)+'. '+c[0]+'\nInitial: '+(s.hyp[i]||'')+'\nConfidence: '+(s.conf[i]||'')+'\nNotes: '+(s.notes[i]||'')+'\nRevision: '+(s.rev[i]||'')+'\n';c[2].forEach((q,j)=>{let a=s.a[i+'-'+j];if(a)t+=q[0]+' — '+q[1][a.b]+' ('+(a.ok?'1':'0')+' point)\n'})});
 t+='\nMini-ethnography: '+s.mini;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='Ethnographer_Field_Report.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.addEventListener('pagehide',()=>{save();if(api)try{api.LMSSetValue('cmi.core.exit','suspend');api.LMSFinish('')}catch(e){}});
home();
</script>
