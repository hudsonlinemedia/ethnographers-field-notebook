<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prof Honey's Field Notebook | The Ethnographer's Field Notebook</title>
<meta name="description" content="An ethnography field game guided by Prof Honey: twelve field sites, evidence decisions and a field notebook.">
<style>
:root{--paper:#f1ebdd;--page:#fbf8f0;--ink:#161616;--graphite:#5b5a56;--soft:#8a8984;--rule:#c9d6dc;--margin:#d9a3a3;--green:#2c7a3a;--red:#c0202b;
 --hand:'Bradley Hand','Segoe Print','Chalkboard SE','Comic Neue','Marker Felt',cursive;--serif:Georgia,'Iowan Old Style','Palatino Linotype',serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#d8d2c3;color:var(--ink);font:17px/1.55 var(--serif);min-height:100vh;
 background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:5px 5px}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
.book{max-width:1120px;margin:0 auto;padding:14px 14px 40px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 4px 12px}
.brand{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;line-height:1.05}
.brand b{font:700 1.25rem var(--hand)}
.brand span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite)}
.topbar nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.6px solid var(--ink);background:var(--page);border-radius:6px 6px 2px 2px;padding:6px 12px;font:600 .9rem var(--hand);box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.tab:hover,.tab:focus-visible{background:#fff}
.status{display:flex;align-items:center;gap:10px;margin:0 4px 10px;font-size:.88rem;color:var(--graphite)}
.pbar{flex:1;height:10px;border:1.4px solid var(--ink);border-radius:6px;background:var(--page);overflow:hidden}
.pbar span{display:block;height:100%;width:0;background:repeating-linear-gradient(135deg,#6d6c67 0 3px,#a5a39c 3px 6px);transition:width .5s}
/* notebook page */
.sheet{position:relative;background:var(--page);border:1.6px solid var(--ink);border-radius:4px 10px 10px 4px;box-shadow:4px 5px 0 rgba(0,0,0,.18),0 18px 30px rgba(0,0,0,.12);
 background-image:linear-gradient(90deg,transparent 54px,var(--margin) 54px,var(--margin) 55.5px,transparent 55.5px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);
 padding:26px 26px 30px 76px;min-height:60vh}
.sheet::before{content:'';position:absolute;left:18px;top:24px;bottom:24px;width:16px;background:radial-gradient(circle at 8px 8px,#d8d2c3 5.5px,var(--ink) 6px,transparent 7px) 0 0/16px 44px repeat-y}
h1,h2,h3{font-family:var(--hand);line-height:1.15;margin:.2em 0 .4em}
h2{font-size:1.65rem}
h3{font-size:1.22rem}
.kicker{font:700 .74rem/1.2 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
p{margin:.5em 0}
.muted{color:var(--graphite)}
/* layout with Prof Honey */
.site{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.guide{position:sticky;top:10px}
.guide .ph{height:300px;width:100%}
.bubble{position:relative;background:#fff;border:1.6px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:.95rem;box-shadow:2px 3px 0 rgba(0,0,0,.18);margin-top:6px}
.bubble::before{content:'';position:absolute;top:-11px;left:46%;border:10px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bubble::after{content:'';position:absolute;top:-8px;left:calc(46% + 2px);border:8px solid transparent;border-bottom-color:#fff;border-top:0}
.bubble .who{display:block;font:700 .95rem var(--hand);margin-bottom:2px}
.bubble.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
/* cards */
.scene{position:relative;background:#fffdf7;border:1.4px solid var(--ink);padding:14px 16px 12px;margin:10px 4px 18px;transform:rotate(-.6deg);box-shadow:2px 3px 0 rgba(0,0,0,.15)}
.scene::before,.scene::after{content:'';position:absolute;width:70px;height:20px;background:rgba(214,209,190,.85);top:-10px;left:-14px;transform:rotate(-10deg);border:1px solid rgba(0,0,0,.08)}
.scene::after{left:auto;right:-14px;transform:rotate(9deg)}
.scene .kicker{margin-bottom:4px}
.decision{margin:16px 0;padding:12px 0 6px;border-top:1.4px dashed var(--soft);position:relative}
.decision h3{margin-top:0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1.6px solid var(--ink);border-radius:8px;padding:10px 12px;box-shadow:2px 2px 0 rgba(0,0,0,.2);transition:transform .08s}
.opt:hover:not(:disabled),.opt:focus-visible{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.opt:disabled{cursor:default}
.opt .box{flex:none;width:20px;height:20px;border:1.6px solid var(--ink);border-radius:3px;margin-top:3px;display:grid;place-items:center;font:700 15px/1 system-ui;background:#fff}
.opt.right{border-color:var(--green)}
.opt.right .box{border-color:var(--green);color:var(--green)}
.opt.picked:not(.right){background:#f2f0ea}
.opt:disabled:not(.picked):not(.right){opacity:.6}
.notes{margin-top:10px;background:#fff8d9;border:1.4px solid #b9a970;border-radius:3px;padding:10px 12px;box-shadow:2px 3px 0 rgba(0,0,0,.12);transform:rotate(.35deg)}
.notes b{font-family:var(--hand)}
.notes .best{display:block;margin-top:4px;color:var(--graphite);font-size:.92rem}
.stamp{position:absolute;right:4px;top:4px;font:700 .95rem/1 'Courier New',monospace;letter-spacing:.08em;color:var(--green);border:2.4px solid var(--green);padding:5px 8px;border-radius:3px;transform:rotate(-8deg);opacity:.9;pointer-events:none}
.stamp.go{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{0%{transform:rotate(-8deg) scale(2.2);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:.9}}
.doodle{position:absolute;right:8px;top:2px;width:90px;height:44px;pointer-events:none}
.doodle path{fill:none;stroke:var(--green);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
label{display:block;margin:10px 0}
label > span{display:block;font:700 1rem var(--hand)}
textarea,input[type=text],select{width:100%;background:rgba(255,255,255,.75);border:1.4px solid var(--soft);border-radius:4px;padding:8px 10px;line-height:32px;font-family:var(--hand);font-size:1.05rem}
textarea{min-height:128px;resize:vertical;background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local;padding-top:2px;line-height:32px}
select{width:auto;line-height:1.3}
.btn{display:inline-block;border:1.8px solid var(--ink);border-radius:8px;padding:10px 16px;background:#fff;font:700 1rem var(--hand);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.btn.primary{background:var(--ink);color:#fbf8f0}
.btn:hover,.btn:focus-visible{transform:translate(-1px,-1px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
/* home */
.cover{display:grid;grid-template-columns:1.15fr .85fr;gap:10px;align-items:end}
.cover h1{font-size:clamp(2.1rem,5vw,3.4rem);margin:.1em 0}
.cover .sub{font:italic 1.1rem var(--serif);color:var(--graphite)}
.cover .credit{font:700 .72rem system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;margin-top:14px}
.cover .ph{height:min(430px,60vw);width:100%}
.mission{border:1.4px solid var(--ink);background:#fff;padding:12px 16px;border-radius:4px;margin:16px 0;box-shadow:2px 3px 0 rgba(0,0,0,.12)}
.part{margin:26px 0 8px}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.sitecard{position:relative;text-align:left;background:#fff;border:1.6px solid var(--ink);border-radius:6px;padding:12px 12px 10px;box-shadow:3px 3px 0 rgba(0,0,0,.2);min-height:104px;display:flex;flex-direction:column;gap:4px}
.sitecard:nth-child(odd){transform:rotate(-.5deg)}.sitecard:nth-child(even){transform:rotate(.5deg)}
.sitecard:hover,.sitecard:focus-visible{transform:translate(-1px,-2px);box-shadow:4px 5px 0 rgba(0,0,0,.22)}
.sitecard .num{font:700 .74rem system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite)}
.sitecard strong{font:700 1.12rem/1.2 var(--hand)}
.sitecard .dots{margin-top:auto;display:flex;gap:4px;flex-wrap:wrap}
.sitecard .dots i{width:10px;height:10px;border:1.3px solid var(--ink);border-radius:50%;display:block}
.sitecard .dots i.on{background:var(--ink)}
.sitecard .dots i.ok{background:var(--green);border-color:var(--green)}
.sitecard .done{position:absolute;right:8px;top:8px;font:700 .7rem 'Courier New',monospace;color:var(--green);border:1.8px solid var(--green);padding:2px 5px;transform:rotate(6deg)}
/* chapter card */
.chapter{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:center;min-height:52vh}
.chapter .ph{height:340px;width:100%}
.chapter .roman{font:700 4.2rem/1 var(--hand)}
/* report */
.entry{border-top:1.4px dashed var(--soft);padding:10px 0}
.entry p{white-space:pre-wrap}
.pill{display:inline-block;font:700 .75rem system-ui;letter-spacing:.06em;border:1.3px solid var(--ink);border-radius:999px;padding:1px 8px;margin-left:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* gag */
.snap{position:absolute;right:16px;top:-6px;font:700 1.3rem var(--hand);transform:rotate(10deg);animation:snap .9s ease}
@keyframes snap{0%{opacity:0;transform:rotate(10deg) scale(.5)}30%{opacity:1;transform:rotate(-6deg) scale(1.2)}100%{transform:rotate(10deg) scale(1)}}
.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px) rotate(-1deg)}40%{transform:translateX(5px) rotate(1deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.bubble.r::before{top:22px;left:auto;right:-11px;border:10px solid transparent;border-left-color:var(--ink);border-right:0}
.bubble.r::after{top:24px;left:auto;right:-8px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.bubble.l::before{top:22px;left:-11px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble.l::after{top:24px;left:-8px;border:8px solid transparent;border-right-color:#fff;border-left:0}
@media (max-width:760px){
 .bubble.r::before,.bubble.l::before{top:-11px;left:46%;right:auto;border:10px solid transparent;border-bottom-color:var(--ink);border-top:0}
 .bubble.r::after,.bubble.l::after{top:-8px;left:calc(46% + 2px);right:auto;border:8px solid transparent;border-bottom-color:#fff;border-top:0}
 body{font-size:16px}
 .sheet{padding:18px 14px 24px 44px}
 .sheet{background-image:linear-gradient(90deg,transparent 32px,var(--margin) 32px,var(--margin) 33.5px,transparent 33.5px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px)}
 .sheet::before{left:8px}
 .site{grid-template-columns:1fr}
 .guide{position:relative;top:0;display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center}
 .guide .ph{height:140px}
 .bubble{margin-top:0}
 .bubble::before{top:18px;left:-11px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
 .bubble::after{top:20px;left:-8px;border:8px solid transparent;border-right-color:#fff;border-left:0}
 .cover{grid-template-columns:1fr}
 .cover .ph{height:300px;order:-1}
 .chapter{grid-template-columns:1fr;text-align:center}
 .chapter .ph{height:250px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.topbar,.status,button,.guide{display:none!important}body{background:#fff}.sheet{box-shadow:none;border:0;background:#fff;padding:0}.sheet::before{display:none}}
.ph{position:relative}
.ph-svg{width:100%;height:100%;display:block;overflow:visible}
.ph .ph-lines{opacity:0}
.ph .ph-pencil{display:none}
.ph.ph-drawing .ph-lines{opacity:1}
.ph.ph-drawing .ph-lines path,.ph.ph-drawing .ph-lines circle{stroke:#1a120a}
.ph.ph-drawing .ph-pencil{display:block}
.ph .ph-steam .ph-puff{opacity:0}
/* easter-egg hat gag */
.ph.gag .ph-hat{transform-box:fill-box;transform-origin:50% 60%;animation:hatFlip 2.2s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes hatFlip{
 0%{transform:none}
 12%{transform:translate(6px,-48px) rotate(-25deg)}
 35%{transform:translate(28px,-150px) rotate(190deg)}
 55%{transform:translate(18px,-175px) rotate(450deg)}
 72%{transform:translate(6px,-80px) rotate(720deg)}
 90%{transform:translate(0,3px) rotate(720deg)}
 100%{transform:translate(0,0) rotate(720deg)}}
.ph.gag .ph-hatshade{animation:shadeOff 2.2s linear forwards}@keyframes shadeOff{0%,100%{opacity:1}8%,90%{opacity:0}}.ph.gag .ph-arm{transform-box:view-box;animation:armL .38s ease-in-out 6 alternate}
.ph.gag .ph-arm-l{transform-origin:95px 264px}.ph.gag .ph-arm-r{transform-origin:205px 264px;animation-name:armR;animation-delay:.09s}
.ph.gag .ph-fore{transform-box:view-box;animation:foreL .38s ease-in-out 6 alternate}
.ph.gag .ph-fore-l{transform-origin:54px 194px}.ph.gag .ph-fore-r{transform-origin:246px 194px;animation-name:foreR;animation-delay:.09s}
.ph.gag .ph-hand{transform-box:fill-box;transform-origin:50% 100%;animation:handL .38s ease-in-out 6 alternate}
.ph.gag .ph-hand-r{animation-name:handR;animation-delay:.09s}
@keyframes armL{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
@keyframes armR{from{transform:rotate(2deg)}to{transform:rotate(-2.5deg)}}
@keyframes foreL{from{transform:rotate(-11deg)}to{transform:rotate(9deg)}}
@keyframes foreR{from{transform:rotate(11deg)}to{transform:rotate(-9deg)}}
@keyframes handL{from{transform:rotate(3deg)}to{transform:rotate(-3deg)}}
@keyframes handR{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.ph.gag .ph-puff{transform-box:fill-box;transform-origin:50% 100%;animation:steam 1.1s ease-out forwards}
@keyframes steam{0%{opacity:0;transform:translateY(4px) scale(.6)}18%{opacity:.7}70%{opacity:.45;transform:translateY(-26px) scale(1.05)}100%{opacity:0;transform:translateY(-34px) scale(1.15)}}

/* after the gag: arms ease down, then the next pose crossfades in */
.ph .ph-svg.ph-old{position:absolute;inset:0;animation:phOut .55s ease forwards}
.ph .ph-svg.ph-new{position:relative;animation:phIn .55s ease forwards}
@keyframes phOut{to{opacity:0}}
@keyframes phIn{from{opacity:0}to{opacity:1}}
.ph.lowering .ph-arm,.ph.lowering .ph-fore,.ph.lowering .ph-hand,.ph.lowering .ph-puff{animation:none!important}
.ph.lowering .ph-arm{transition:transform .5s ease-in-out;transform-box:view-box}
.ph.lowering .ph-arm-l{transform-origin:95px 264px}.ph.lowering .ph-arm-r{transform-origin:205px 264px}
.ph.lowering .ph-arm-l{transform:rotate(-125deg)}
.ph.lowering .ph-arm-r{transform:rotate(125deg)}

</style>
</head>
<body>
<div class="book">
 <header class="topbar">
  <button class="brand" onclick="home()" aria-label="Prof Honey's Field Notebook, back to the cover"><b>Prof Honey's Field Notebook</b><span>The Ethnographer's Field Notebook</span></button>
  <nav aria-label="Notebook">
   <button class="tab" onclick="home()">Field sites</button>
   <button class="tab" onclick="report()">My field notebook</button>
   <button class="tab" onclick="download()">Download report</button>
  </nav>
 </header>
 <div class="status"><span id="status" aria-live="polite"></span><div class="pbar" aria-hidden="true"><span id="bar"></span></div></div>
 <main class="sheet" id="view" tabindex="-1"></main>
</div>
<script>
/* ===== Prof Honey — ethnographer edition (graphite sketch, field vest, notebook & pencil; red/blond striped hair, red cat-eye sunglasses) ===== */
const Honey = (() => {
  const INK = '#161616', SKIN = '#efe6d8', SHIRT = '#ebe8e1', JACKET = '#9a9893', JACKET_D = '#7a7873', LAPEL = '#b4b2ac', SLEEVE = '#dedbd3', CUFF = '#c8c5bd', HAND = '#efe6d8',
    HAT = '#6e4e33', HAT_D = '#553a24', BAND = '#2a1c12', SCARF = '#6a5442', STRAP = '#3c3b39', GLOVE = '#3a2a1d',
    HR = '#c0202b', HB = '#e6cf96', GL = '#c8202a', LENS = '#111111', BRASS = '#d2d0c9', SKIN_SH = '#d6cdbd';
  const HAT_T = 'rotate(-6 150 100)';
  const CHIN = 0.10; // extra lower-face length (0.10 = 10% longer below the glasses)
  const AGE = 0.5; // 0.5 = about five years older, 1 = about ten years older (smile lines, firmer cheekbones, slimmer lips, straighter brows)
  const mx = d => d.replace(/(-?\d+\.?\d*)\s+(-?\d+\.?\d*)/g, (m, x, y) => (300 - parseFloat(x)) + ' ' + y);

  const MOUTH = '#5a524c';
  // shape: {d, f(fill), w(stroke width), s(stroke color), t(transform), h(hatch overlay), nl(no line layer), ng(no ghost line), o(opacity)}
  const hairBack = [
    {d:'M 106 124 C 102 160 98 200 97 240 L 203 240 C 202 200 198 160 194 124 Z', f:HB, w:1.6}
  ];
  // long straight striped hair, like the detective: three broad bands a side
  // long straight hair from a centre part over a natural, rounded crown; ends taper
  const HAIR = 'M 150 74 C 122 74 104 90 102 120 C 98 175 94 225 94 262 Q 95 284 102 299 L 106 292 L 110 300 L 114 293 Q 119 280 119 262 C 119 225 121 175 120 130 L 118 128 C 120 108 132 94 150 92 Z', CROWNP = 'M 150 74 C 122 74 104 90 102 120 L 102 134 L 118.5 134 L 118 128 C 120 108 132 94 150 92 Z', STREAK_TOP = 'M 147 79 C 134 80 120 88 113 100 C 108 110 108 122 108.5 134', STREAK = 'M 147 79 C 134 80 120 88 113 100 C 108 110 108 122 108.5 134 C 108 180 105 225 105 262 Q 105 280 107 292';
  const hairFront = [
    {d:HAIR, f:HB, w:1.6},{d:mx(HAIR), f:HB, w:1.6},
    {d:STREAK, f:'none', w:4.5, s:HR, nl:1, ng:1},{d:mx(STREAK), f:'none', w:4.5, s:HR, nl:1, ng:1},
    {d:'M 98.5 150 C 96 200 96 245 99 288 M 116 150 C 116 200 115 245 113 286', w:.9, s:INK, o:.4, nl:1, ng:1},{d:mx('M 98.5 150 C 96 200 96 245 99 288 M 116 150 C 116 200 115 245 113 286'), w:.9, s:INK, o:.4, nl:1, ng:1}
  ];
  const torsoL = 'M 130 236 C 114 240 98 246 88 256 C 82 264 84 276 90 290 C 96 306 104 322 110 340 C 108 360 104 380 102 400 L 142 400 L 143 318 L 129 284 Z';
  const lapelL = 'M 129 238 L 115 266 L 124 272 L 118 284 L 143 318 Z';
  const body = [
    // neck
    {d:'M 137 188 C 138 204 137 220 134 236 L 166 236 C 163 220 162 204 163 188 Z', f:SKIN, w:2.2},
    {d:'M 138 194 C 144 202 156 202 162 194 L 162 208 C 156 214 144 214 138 208 Z', h:1},
    // shirt
    {d:'M 116 236 C 130 230 170 230 184 236 L 192 400 L 108 400 Z', f:SHIRT, w:2.2},
    {d:'M 138 234 L 150 270 L 162 234 Z', f:SKIN, w:0},
    {d:'M 150 270 L 150 400', w:1.6},
    {c:[150,290,2.5], f:'#d9c79c', w:1.4},{c:[150,312,2.5], f:'#d9c79c', w:1.4},{c:[150,372,2.5], f:'#d9c79c', w:1.4},
    {d:'M 136 230 L 122 256 L 141 266 L 148 262 Z', f:SHIRT, w:2.2},
    {d:mx('M 136 230 L 122 256 L 141 266 L 148 262 Z'), f:SHIRT, w:2.2},
    // tapered, belted field jacket
    {d:torsoL, f:JACKET, w:2.6},{d:mx(torsoL), f:JACKET, w:2.6},
    {d:mx('M 92 290 C 98 306 104 322 108 338 L 120 338 C 114 322 108 306 104 292 Z'), h:1},
    {d:mx('M 108 352 C 106 370 104 386 103 400 L 116 400 C 116 386 118 370 120 352 Z'), h:1},
    {d:lapelL, f:LAPEL, w:2.2},{d:mx(lapelL), f:LAPEL, w:2.2},
    {d:'M 104 250 L 124 244 L 127 254 L 107 260 Z', f:JACKET_D, w:1.9},{d:mx('M 104 250 L 124 244 L 127 254 L 107 260 Z'), f:JACKET_D, w:1.9},
    {c:[118,250,2.1], f:BRASS, w:1.2},{c:[182,250,2.1], f:BRASS, w:1.2},
    // chest pockets
    {d:'M 106 298 L 134 298 L 134 322 L 108 322 Z', f:JACKET, w:1.9},{d:'M 104 287 L 136 287 L 135 300 L 106 300 Z', f:JACKET_D, w:1.9},{c:[120,294,2.2], f:BRASS, w:1.2},
    {d:mx('M 106 298 L 134 298 L 134 322 L 108 322 Z'), f:JACKET, w:1.9},{d:mx('M 104 287 L 136 287 L 135 300 L 106 300 Z'), f:JACKET_D, w:1.9},{c:[180,294,2.2], f:BRASS, w:1.2},
    // hip pocket flaps
    {d:'M 110 364 L 138 364 L 138 376 L 109 376 Z', f:JACKET_D, w:1.8},{d:mx('M 110 364 L 138 364 L 138 376 L 109 376 Z'), f:JACKET_D, w:1.8},
  ];
  const bodyB = [
    // satchel strap + buckle
    {d:'M 192 242 L 210 248 L 108 400 L 86 400 Z', f:STRAP, w:2.3},
    {d:'M 201 250 L 97 400', w:0.9, s:'#a07850', ng:1},
    {d:'M 151 292 L 177 292 L 177 308 L 151 308 Z', f:BRASS, w:2, t:'rotate(-56 164 300)'},
    {d:'M 156 296 L 172 296 L 172 304 L 156 304 Z', f:STRAP, w:1.3, t:'rotate(-56 164 300)'}
  ];

    const set = (yLine, yFull) => { clipL.setAttribute('height', Math.max(0, yLine + 40)); clipF.setAttribute('height', Math.max(0, yFull + 40)); };
    set(TOP - 40, TOP - 40);

    let t0 = null;
    const step = now => {
      if (container._phTok !== token || !container.isConnected) return;
      if (t0 === null) t0 = now;
      const p = Math.min(1, (now - t0) / dur);
      const y = TOP + (BOTTOM - TOP) * p;

      else { set(460, 460); container.classList.remove('ph-drawing'); container.classList.add('ph-done'); }
    };
    requestAnimationFrame(step);
  }
  return { svg, mount };
})();

 <div class="mission"><h2>Your mission</h2><p>Read your course module and watch the assigned videos first. Then investigate twelve field sites. Record an initial hypothesis, examine evidence one decision at a time, and revise your interpretation. First correct decisions earn one point; written work is not automatically graded. You can revisit feedback at any time. Work in several sessions and download your notebook before leaving; browser storage may not persist across devices.</p>
 <label><span>Your name (optional)</span><input type="text" value="${esc(s.name)}" oninput="s.name=this.value;saveSoon()" autocomplete="name"></label></div>`+
 PARTS.map(p=>`<section class="part"><div class="kicker">Part ${p.n}</div><h2>${p.t}</h2><div class="sites">${C.map((c,i)=>({c,i})).filter(({i})=>i>=p.from&&i<=p.to).map(({c,i})=>`<button class="sitecard" onclick="openCase(${i})"><span class="num">Field site ${i+1}</span><strong>${esc(c[0])}</strong><span class="dots" aria-label="${c[2].filter((q,k)=>s.a[i+'-'+k]).length} of ${c[2].length} decisions">${c[2].map((q,k)=>{const a=s.a[i+'-'+k];return `<i class="${a?(a.ok?'ok':'on'):''}"></i>`}).join('')}</span>${done(i)?'<span class="done">DONE</span>':''}</button>`).join('')}</div></section>`).join('')+
 `<section class="part"><div class="kicker">Optional</div><h2>Real-world mini-ethnography</h2><p>Observe an ordinary activity for 15–30 minutes in a setting where you have permission. Do not record identifying details or private conversations. Describe artifacts, behavior, tacit rules, differing meanings and one unanswered question.</p><label><span class="sr">Mini-ethnography</span><textarea oninput="s.mini=this.value;saveSoon()">${esc(s.mini)}</textarea></label></section>`;
 honey(document.getElementById('homeHoney'),{pose:'notes',draw:true,dur:2.6});
 bubble(document.getElementById('homeBubble'),started?`Welcome back${s.name?', '+esc(s.name):''}. Your notebook is right where you left it.`:'Hello, I’m Professor Honey. Grab a pencil. We’re going to learn to see the ordinary as strange, and the strange as ordinary.');
 update();toTop()}

function openCase(i){const p=partOf(i);
 if(i===PARTS[p].from&&!seenPart[p]&&!C[i][2].some((q,j)=>s.a[i+'-'+j])){seenPart[p]=1;return chapter(p)}
 seenPart[p]=1;siteView(i)}
function chapter(p){const P=PARTS[p];
 v.innerHTML=`<section class="chapter"><div class="ph" id="chHoney"></div><div><div class="kicker">Part</div><div class="roman">${P.n}</div><h2>${P.t}</h2><p class="muted">Field sites ${P.from+1}${P.to>P.from?'–'+(P.to+1):''}</p><div class="bubble l" id="chBubble"></div><div class="row"><button class="btn primary" onclick="siteView(${P.from})">Begin field site ${P.from+1}</button><button class="btn" onclick="home()">Back to all sites</button></div></div></section>`;
 honey(document.getElementById('chHoney'),{pose:p%2?'write':'notes',draw:true,dur:1.8});bubble(document.getElementById('chBubble'),P.line);toTop()}

let cur=-1;
function siteView(i,keep){const c=C[i];cur=i;let k=c[2].findIndex((q,j)=>!s.a[i+'-'+j]);if(k<0)k=c[2].length;
 const y=window.scrollY;
 v.innerHTML=`<div class="site"><aside class="guide"><div class="ph" id="sideHoney"></div><div class="bubble" id="sideBubble" aria-live="polite"></div></aside><article>
 <div class="kicker">Field site ${i+1} / 12 · Part ${PARTS[partOf(i)].n}</div><h2>${esc(c[0])}</h2>
 <div class="scene"><div class="kicker">Field scene</div><p>${esc(c[1])}</p></div>
 <label><span>Initial hypothesis / first reaction</span><textarea oninput="s.hyp[${i}]=this.value;saveSoon()">${esc(s.hyp[i])}</textarea></label>
 <label><span>Initial confidence</span><select onchange="s.conf[${i}]=this.value;save()">${['Not recorded','Low','Medium','High'].map(x=>`<option ${s.conf[i]===x?'selected':''}>${x}</option>`).join('')}</select></label>
 ${c[2].slice(0,Math.min(k+1,c[2].length)).map((q,j)=>decision(i,j)).join('')}
 ${k===c[2].length?`<section class="decision"><div class="kicker">Field notebook</div><h3>${esc(c[3])}</h3><label><span class="sr">Field notes</span><textarea oninput="s.notes[${i}]=this.value;saveSoon()">${esc(s.notes[i])}</textarea></label><label><span>What evidence changed or strengthened your initial hypothesis?</span><textarea oninput="s.rev[${i}]=this.value;saveSoon()">${esc(s.rev[i])}</textarea></label><div class="row"><button class="btn primary" onclick="${i<11?'openCase('+(i+1)+')':'report()'}">${i<11?'Next field site →':'View my final report'}</button><button class="btn" onclick="home()">All field sites</button></div></section>`:''}
 </article></div>`;
 const side=document.getElementById('sideHoney'),b=document.getElementById('sideBubble');
 if(k===c[2].length){honey(side,{pose:'write',mouth:'grin'});bubble(b,i<11?'Site complete. Now the important part: write it up while it’s fresh.':'That’s the whole notebook. Write your final thick description, then download your report.')}
 else if(k===0){honey(side,{pose:'notes'});bubble(b,INTRO[i])}
 else{honey(side,{pose:'notes'});bubble(b,'Next piece of evidence. Take your time.')}
 if(keep)window.scrollTo(0,y);else toTop()}

function decision(i,j){const q=C[i][2][j],a=s.a[i+'-'+j];
 return `<section class="decision" id="d${i}-${j}"><div class="kicker">Evidence decision ${j+1} of ${C[i][2].length}</div><h3>${esc(q[0])}</h3><div class="opts" role="group" aria-label="Choices">${q[1].map((o,b)=>{
  const cls=a?((b===q[2]?' right':'')+(a.b===b?' picked':'')):'';const mark=a?(b===q[2]?'✓':(a.b===b?'✕':'')):'';
  return `<button class="opt${cls}" ${a?'disabled':''} onclick="answer(${i},${j},${b})"><span class="box" aria-hidden="true">${mark}</span><span>${a&&a.b===b?'<span class="sr">Your choice: </span>':''}${esc(o)}</span></button>`}).join('')}</div>
  ${a?`<div class="notes"><b>Prof Honey’s notes:</b> ${a.ok?'✓ Evidence point earned.':'Reconsider this interpretation.'} ${esc(q[3])}<span class="best">Best supported choice: ${esc(q[1][q[2]])}</span></div>`:''}</section>`}

function answer(i,j,b){const key=i+'-'+j;if(s.a[key])return;const ok=b===C[i][2][j][2];s.a[key]={b,ok};save();
 siteView(i,true);
 const el=document.getElementById(`d${i}-${j}`),side=document.getElementById('sideHoney'),bb=document.getElementById('sideBubble');
 const last=done(i);
 if(ok){wrongRun=0;const n=celeb++%4;
  if(n===0||n===2)el.insertAdjacentHTML('beforeend',`<span class="stamp go">${STAMPS[(celeb>>1)%STAMPS.length]}</span>`);
  else el.insertAdjacentHTML('beforeend',`<svg class="doodle" viewBox="0 0 90 44" aria-hidden="true"><path d="${DOODLES[(celeb>>1)%DOODLES.length]}"/></svg>`);
  if(!last){honey(side,{pose:celeb%2?'point':'write',mouth:'grin'});bubble(bb,YES[yesI++%YES.length])}}
 else{wrongRun++;
  if(wrongRun>=3){wrongRun=0;honey(side,{pose:'oops',mouth:'o',brow:'up'});side.insertAdjacentHTML('beforeend','<span class="snap" aria-hidden="true">snap!</span>');el.classList.add('shake');
   if(!last)bubble(bb,'Three in a row? Even my pencil just snapped. Deep breath: reread the scene, then my notes.')}
  else if(!last){honey(side,{pose:'idle'});bubble(bb,NO[noI++%NO.length])}}
 if(last){honey(side,{pose:'write',mouth:'grin'});bubble(bb,i<11?'Site complete. Now the important part: write it up while it’s fresh.':'That’s the whole notebook. Write your final thick description, then download your report.')}
 const nx=document.getElementById(`d${i}-${j+1}`);setTimeout(()=>{(nx||el).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:nx?'start':'nearest'})},nx?650:0)}

function report(){
 v.innerHTML=`<div class="kicker">Field report</div><h2>My field notebook</h2><p>${esc(s.name)}${s.name?' · ':''}${score()} / ${total} evidence points. Written analysis is for reflection or instructor review.</p><div class="row"><button class="btn primary" onclick="download()">Save text report</button><button class="btn" onclick="window.print()">Print</button></div>`+
 C.map((c,i)=>`<section class="entry"><h3>${i+1}. ${esc(c[0])} ${done(i)?'<span class="pill">complete</span>':''}</h3><p><b>Initial hypothesis:</b> ${esc(s.hyp[i]||'Not entered')} (${esc(s.conf[i]||'confidence not recorded')})</p><p><b>Field notes:</b> ${esc(s.notes[i]||'Not entered')}</p><p><b>Revision:</b> ${esc(s.rev[i]||'Not entered')}</p><button class="btn" onclick="openCase(${i})">Return to site</button></section>`).join('')+
 `<section class="entry"><h3>Mini-ethnography</h3><p>${esc(s.mini)||'Not entered'}</p></section>`;toTop()}

function download(){let t='THE ETHNOGRAPHER’S FIELD NOTEBOOK\n'+s.name+'\nEvidence points: '+score()+'/'+total+'\n';
 C.forEach((c,i)=>{t+='\n'+(i+1)+'. '+c[0]+'\nInitial: '+(s.hyp[i]||'')+'\nConfidence: '+(s.conf[i]||'')+'\nNotes: '+(s.notes[i]||'')+'\nRevision: '+(s.rev[i]||'')+'\n';c[2].forEach((q,j)=>{let a=s.a[i+'-'+j];if(a)t+=q[0]+' — '+q[1][a.b]+' ('+(a.ok?'1':'0')+' point)\n'})});
 t+='\nMini-ethnography: '+s.mini;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='Ethnographer_Field_Report.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.addEventListener('pagehide',()=>{save();if(api)try{api.LMSSetValue('cmi.core.exit','suspend');api.LMSFinish('')}catch(e){}});
home();
</script>
</body>
</html>
